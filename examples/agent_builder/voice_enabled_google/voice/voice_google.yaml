name: google_voice_config
llm_aggregation_timeout_seconds: 0.8
speech_to_text:
  provider: google_stt
  google_stt_config:
    project_id: "project-id"
    credentials_json: "service-account-json"
    language_code: "en-US"
    model: "latest_long"
    enable_automatic_punctuation: true
    enable_interim_results: true
text_to_speech:
  provider: google_tts
  google_tts_config:
    credentials_json: "service-account-json"
    voice: "en-US-Neural2-C"
    language: "en-US"
    speaking_rate: 1.0
language: "en-US"
